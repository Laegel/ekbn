name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache/save@v4
        with:
          path: dist/
          key: dist-${{ github.sha }}

  cross-build:
    needs: build
    strategy:
      matrix:
        target:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/cache/restore@v4
        with:
          path: dist/
          key: dist-${{ github.sha }}
      - name: Cross-compile binary
        run: |
          GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
            go build -o ekbn-${{ matrix.target.goos }}${{ matrix.target.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: ekbn-${{ matrix.target.goos }}-binary
          path: ekbn-${{ matrix.target.goos }}${{ matrix.target.ext }}
